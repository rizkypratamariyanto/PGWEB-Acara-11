<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Web GIS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css">

    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
        .legend {
            background: white;
            padding: 6px 8px;
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(0,0,0,.3);
            max-height: 300px;
            overflow: auto;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"></script>

    <script>
        var GEOSERVER = "http://localhost:8080/geoserver/ne/wms";

        /* Peta awal: langsung ke extent DIY */
        var map = L.map("map").setView([-7.87, 110.42], 10);

        /* Basemap OSM */
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        /* Layer WMS GeoServer: ne:DIY */
        var wmsDIY = L.tileLayer.wms(GEOSERVER, {
            layers: "ne:DIY",
            format: "image/png",
            transparent: true,
            version: "1.1.1"
        }).addTo(map);

        /* Debug: tampilkan error jika tile gagal dimuat */
        wmsDIY.on("tileerror", function (e) {
            console.error("Tile WMS gagal dimuat:", e.tile.src);
        });

        /* Legenda dari GeoServer (GetLegendGraphic) */
        var legend = L.control({ position: "bottomleft" });
        legend.onAdd = function () {
            var div = L.DomUtil.create("div", "legend");
            div.innerHTML =
                '<img src="' + GEOSERVER +
                '?service=WMS&version=1.1.0&request=GetLegendGraphic' +
                '&format=image/png&layer=ne:DIY">';
            return div;
        };
        legend.addTo(map);

        /* Layer control */
        L.control.layers(
            { "OpenStreetMap": osm },
            { "Batas DIY": wmsDIY },
            { collapsed: false, position: "topright" }
        ).addTo(map);
    </script>

</body>

</html>
